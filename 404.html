<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="site-root" content="/">
<title>页面不存在 · 蒸馏图书馆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1a17'/%3E%3Cpath d='M9 8.5h9.5a4 4 0 0 1 4 4v11.5a3 3 0 0 0-3-3H9z' fill='%23efe7d6'/%3E%3Cpath d='M9 8.5v13' stroke='%23b8332a' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
:root{--paper:#f7f5f0;--ink:#1c1a17;--ink2:#4a453d;--muted:#8a8478;--line:#e3ded3;--accent:#b8332a;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:8vh 8vw;line-height:1.8;-webkit-font-smoothing:antialiased}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--accent);margin-bottom:22px}
h1{font-family:var(--serif);font-size:clamp(34px,7vw,62px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--muted)}
p{margin-top:20px;color:var(--ink2);font-size:14.5px;max-width:460px}
a.back{display:inline-flex;align-items:center;gap:9px;margin-top:34px;height:40px;padding:0 22px;
  background:var(--ink);color:var(--paper);font-size:13px;text-decoration:none;border-radius:2px;transition:.2s}
a.back:hover{background:var(--accent)}
.rule{width:62px;height:1px;background:var(--line);margin:30px 0 0}
.fine{position:fixed;left:8vw;bottom:5vh;font-size:11px;color:var(--muted);letter-spacing:.05em}
</style>
</head>
<body>
  <div class="code">ERROR 404</div>
  <h1>这一页<em>不在架上</em>。</h1>
  <p>链接可能已经失效，或者书籍被移动了位置。回到书架重新找一本。</p>
  <a class="back" id="back" href="/">← 返回书架</a>
  <div class="rule"></div>
  <div class="fine">蒸馏图书馆 · Distilled Library</div>
  <script>
    // 站点可能部署在子路径（如 /library/），返回地址由 <meta name="site-root"> 决定
    (function () {
      var meta = document.querySelector('meta[name="site-root"]');
      var root = (meta && meta.content) || '/';
      if (root.slice(-1) !== '/') root += '/';
      var a = document.getElementById('back');
      if (a) a.href = root;
    })();
  </script>
</body>
</html>
